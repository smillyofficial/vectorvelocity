<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Velocity: FIXED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #00f2ff;
            --danger: #ff0055;
            --orb: #ffeb3b;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(180deg, #1a1a2e 0%, #000000 100%);
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            overflow: hidden;
            border-radius: 8px;
        }

        /* --- BACKGROUND --- */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: scrollBg 5s linear infinite;
            z-index: 0;
        }
        @keyframes scrollBg { from { transform: translateX(0); } to { transform: translateX(-60px); } }

        /* --- ENTITIES --- */
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            /* Default skin, changes via JS */
            background: linear-gradient(45deg, #fce38a, #f38181); 
            border: 2px solid white;
            box-sizing: border-box;
            z-index: 20;
            left: 150px; /* Fixed Horizontal Position */
        }

        /* Ship Shape */
        #player.ship {
            border-radius: 0 50% 50% 0;
            height: 25px;
            margin-bottom: 7px; /* Center adjustment */
        }

        #floor, #ceiling {
            position: absolute;
            width: 100%;
            height: 90px;
            background: #0f0f1a;
            z-index: 10;
            border-top: 3px solid white;
            bottom: 0;
        }
        #ceiling {
            top: -90px;
            bottom: auto;
            border-bottom: 3px solid white;
            border-top: none;
            transition: top 0.3s;
        }

        /* --- OBSTACLES --- */
        .obstacle { position: absolute; z-index: 15; }

        /* Spike Hitbox is smaller than visual to be fair */
        .spike {
            width: 40px; height: 40px;
        }
        .spike::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid var(--danger);
            filter: drop-shadow(0 0 5px var(--danger));
        }

        .block {
            width: 40px; height: 40px;
            background: rgba(0, 242, 255, 0.2);
            border: 2px solid var(--primary);
            box-sizing: border-box;
        }

        .orb {
            width: 36px; height: 36px;
            background: radial-gradient(circle, var(--orb) 40%, transparent 70%);
            border: 3px solid var(--orb);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--orb);
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .portal {
            width: 30px; height: 90px;
            border-radius: 10px;
            opacity: 0.8;
            box-shadow: 0 0 20px currentColor;
        }
        .portal-ship { background: #d900ff; color: #d900ff; }
        .portal-cube { background: #00ff6a; color: #00ff6a; }

        /* --- UI --- */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.92);
        }
        .hidden { display: none !important; }

        h1 { margin: 0; font-size: 2.5rem; color: var(--primary); text-transform: uppercase; letter-spacing: 5px; }
        h2 { margin: 10px 0 20px 0; font-size: 1rem; color: #aaa; font-weight: normal; }

        /* Skin Selector */
        .skin-container { display: flex; gap: 15px; margin: 20px 0; }
        .skin-opt { width: 50px; height: 50px; cursor: pointer; border: 2px solid #333; transition: 0.2s; }
        .skin-opt:hover { transform: scale(1.1); }
        .skin-opt.selected { border-color: white; box-shadow: 0 0 15px white; }

        .btn {
            padding: 15px 50px; font-family: 'Orbitron'; font-size: 1.2rem;
            color: white; background: var(--danger); border: none;
            cursor: pointer; transition: 0.2s; clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%, 0% 10%);
        }
        .btn:hover { background: white; color: black; transform: scale(1.05); }

        select {
            padding: 10px; background: #111; color: white; border: 1px solid #333;
            font-family: 'Orbitron'; margin-bottom: 20px; font-size: 1.1rem;
        }

        #hud { position: absolute; top: 20px; left: 20px; z-index: 50; font-size: 1.2rem; }
        #progress-bar { position: absolute; top: 0; left: 0; height: 6px; background: var(--primary); width: 0%; z-index: 90; }

    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="bg-grid"></div>
        <div id="progress-bar"></div>
        <div id="hud" class="hidden"><span id="level-name">Level 1</span></div>

        <div id="game-world">
            <div id="player"></div>
            <div id="obstacles-container"></div>
        </div>

        <div id="floor"></div>
        <div id="ceiling"></div>

        <div id="main-menu" class="ui-layer">
            <h1>Vector Velocity</h1>
            <h2>Fixed Edition</h2>

            <div style="margin-bottom: 5px; color: #888; font-size: 0.8rem;">SELECT SKIN</div>
            <div class="skin-container">
                <div class="skin-opt selected" style="background: linear-gradient(45deg, #fce38a, #f38181);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #00c6ff, #0072ff);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #11998e, #38ef7d);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #833ab4, #fd1d1d);" onclick="setSkin(this)"></div>
            </div>

            <select id="level-select">
                <option value="1">Lvl 1: The Beginning (Easy)</option>
                <option value="2">Lvl 2: Stereo (Easy)</option>
                <option value="3">Lvl 3: Polargeist (Normal)</option>
                <option value="4">Lvl 4: Dry Out (Normal)</option>
                <option value="5">Lvl 5: Base After (Hard)</option>
                <option value="6">Lvl 6: Can't Let Go (Hard)</option>
                <option value="7">Lvl 7: Jumper (Harder)</option>
                <option value="8">Lvl 8: Time Machine (Insane)</option>
                <option value="9">Lvl 9: NIGHTMARE (Extreme)</option>
                <option value="10">Lvl 10: ZENITH (Impossible)</option>
            </select>

            <button class="btn" onclick="startGame()">START LEVEL</button>
        </div>

        <div id="death-screen" class="ui-layer hidden">
            <h1 style="color: var(--danger);">CRASHED</h1>
            <p id="death-quote" style="color: #aaa; margin: 20px;">0% Complete</p>
            <button class="btn" onclick="startGame()">RETRY</button>
            <button class="btn" style="background: transparent; border: 1px solid #555; margin-top: 10px; font-size: 0.8rem;" onclick="showMenu()">MENU</button>
        </div>

        <div id="win-screen" class="ui-layer hidden">
            <h1 style="color: gold;">LEVEL COMPLETE!</h1>
            <div style="font-size: 4rem; margin: 20px;">🏆</div>
            <button class="btn" onclick="showMenu()">MENU</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (Procedural & Auto-playing) ---
        const AudioEngine = {
            ctx: null,
            isPlaying: false,
            nextNoteTime: 0,
            noteIndex: 0,
            tempo: 120,

            init: function(levelDifficulty) {
                // Determine BPM based on level (1-10)
                if (levelDifficulty <= 3) this.tempo = 120; // Slow
                else if (levelDifficulty <= 7) this.tempo = 145; // Fast
                else this.tempo = 175; // Hardcore

                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.isPlaying = true;
                this.nextNoteTime = this.ctx.currentTime;
                this.scheduler(levelDifficulty);
            },

            stop: function() {
                this.isPlaying = false;
            },

            playTone: function(freq, time, type, dur) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, time);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(0.3, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + dur);
                osc.start(time);
                osc.stop(time + dur);
            },

            scheduler: function(difficulty) {
                if (!this.isPlaying) return;
                const secondsPerBeat = 60.0 / this.tempo;
                const lookahead = 0.1;

                while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
                    // Kick Drum (Every beat)
                    this.playTone(150, this.nextNoteTime, 'sine', 0.1);
                    
                    // Hi-Hat (Off beat)
                    if (this.noteIndex % 2 !== 0) {
                         // Simple noise buffer approximation using high freq square
                         this.playTone(8000, this.nextNoteTime, 'square', 0.05);
                    }

                    // Bassline (Changes based on difficulty)
                    if (this.noteIndex % 4 === 0) {
                        let bassFreq = (difficulty > 7) ? 45 : 65; // Lower bass for harder levels
                        this.playTone(bassFreq, this.nextNoteTime, 'sawtooth', 0.3);
                    }

                    this.nextNoteTime += secondsPerBeat;
                    this.noteIndex++;
                }
                setTimeout(() => this.scheduler(difficulty), 25);
            }
        };

        // --- GAME ENGINE ---
        const playerEl = document.getElementById('player');
        const worldEl = document.getElementById('game-world');
        const obsContainer = document.getElementById('obstacles-container');
        const floorHeight = 90;
        
        let gameState = {
            active: false,
            levelData: [],
            distance: 0,
            speed: 8,
            player: { y: 0, vy: 0, rot: 0, mode: 'cube' },
            gravity: 0.9,
            jumpPower: 14.5,
            currentSkin: 'linear-gradient(45deg, #fce38a, #f38181)'
        };

        // --- SKIN SELECTION ---
        function setSkin(el) {
            document.querySelectorAll('.skin-opt').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            gameState.currentSkin = el.style.background;
            playerEl.style.background = gameState.currentSkin;
        }

        // --- LEVEL GENERATION (Smart Spacing) ---
        function generateLevel(levelNum) {
            let data = [];
            // Level length increases with difficulty
            let length = 150 + (levelNum * 20); 
            let difficulty = levelNum / 10; // 0.1 to 1.0

            let safeCount = 0; // Forced empty spaces

            for (let i = 0; i < length; i++) {
                // First 20 blocks are always safe
                if (i < 20 || safeCount > 0) {
                    data.push({ type: 0, x: i * 60 });
                    safeCount--;
                    continue;
                }

                let r = Math.random();
                let type = 0;

                // LOGIC: Harder levels = more spikes, less space
                // Minimum gap is crucial for playability
                
                if (r < (0.1 + difficulty * 0.4)) {
                    // Spawn Spike
                    type = 1;
                    safeCount = (difficulty > 0.8) ? 2 : 3; // High levels have tighter gaps
                } else if (r > 0.96 && levelNum > 3) {
                    // Spawn Orb
                    type = 3; 
                    safeCount = 3;
                } else if (i === 60 && levelNum > 1) {
                    type = 4; // Ship Portal
                } else if (i === 120 && levelNum > 1) {
                    type = 5; // Cube Portal
                }

                data.push({ type: type, x: i * 60 });
            }
            return data;
        }

        // --- CORE FUNCTIONS ---

        function startGame() {
            const levelVal = parseInt(document.getElementById('level-select').value);
            
            // Audio
            AudioEngine.stop();
            AudioEngine.init(levelVal);

            // Reset Logic
            gameState.active = true;
            gameState.distance = 0;
            gameState.player.y = 0;
            gameState.player.vy = 0;
            gameState.player.rot = 0;
            gameState.player.mode = 'cube';
            gameState.levelData = generateLevel(levelVal);

            // UI Reset
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('level-name').innerText = "Level " + levelVal;
            
            // Player Reset
            playerEl.style.background = gameState.currentSkin;
            playerEl.classList.remove('ship');
            document.getElementById('ceiling').style.top = '-90px';

            // Clear World
            obsContainer.innerHTML = '';
            
            // Pre-render logic (simplification: we spawn as we go)
            gameLoop();
        }

        function showMenu() {
            gameState.active = false;
            AudioEngine.stop();
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function die() {
            gameState.active = false;
            AudioEngine.stop();
            let pct = Math.floor((gameState.distance / (gameState.levelData.length * 60)) * 100);
            document.getElementById('death-quote').innerText = `${pct}% Complete`;
            document.getElementById('death-screen').classList.remove('hidden');
        }

        // --- INPUT ---
        let inputHeld = false;
        
        function handleInput(down) {
            inputHeld = down;
            if (down && gameState.active) {
                // Cube Jump
                if (gameState.player.mode === 'cube') {
                    if (gameState.player.y <= 0.5) { // Ground check
                        gameState.player.vy = gameState.jumpPower;
                    }
                    // Orb Check (Distance based)
                    checkOrbs();
                }
            }
        }
        
        window.addEventListener('mousedown', () => handleInput(true));
        window.addEventListener('mouseup', () => handleInput(false));
        window.addEventListener('keydown', (e) => { if(e.code==='Space') handleInput(true) });
        window.addEventListener('keyup', (e) => { if(e.code==='Space') handleInput(false) });

        function checkOrbs() {
            // Check active orbs in DOM
            const orbs = document.querySelectorAll('.orb');
            const pRect = playerEl.getBoundingClientRect();
            
            orbs.forEach(orb => {
                const oRect = orb.getBoundingClientRect();
                // Check if close enough
                const dx = (pRect.left + pRect.width/2) - (oRect.left + oRect.width/2);
                const dy = (pRect.top + pRect.height/2) - (oRect.top + oRect.height/2);
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 60) { // Hit radius
                    gameState.player.vy = 15; // Orb boost
                    orb.style.opacity = 0; // Visual feedback
                }
            });
        }

        // --- MAIN LOOP ---

        function gameLoop() {
            if (!gameState.active) return;

            // 1. PHYSICS
            if (gameState.player.mode === 'cube') {
                gameState.player.vy -= gameState.gravity;
                gameState.player.y += gameState.player.vy;

                // Floor Collision
                if (gameState.player.y <= 0) {
                    gameState.player.y = 0;
                    gameState.player.vy = 0;
                    // Snap Rotation
                    let r = gameState.player.rot % 90;
                    if (r > 0) gameState.player.rot += (90 - r) * 0.2;
                } else {
                    gameState.player.rot += 6; // Spin
                }
            } else { // Ship
                if (inputHeld) gameState.player.vy += 0.5;
                else gameState.player.vy -= 0.5;
                
                // Cap speed
                if (gameState.player.vy > 8) gameState.player.vy = 8;
                if (gameState.player.vy < -8) gameState.player.vy = -8;

                gameState.player.y += gameState.player.vy;
                gameState.player.rot = gameState.player.vy * -3;

                // Ship Ceiling/Floor
                if (gameState.player.y <= 0) { gameState.player.y = 0; gameState.player.vy = 0; }
                if (gameState.player.y >= 270) { gameState.player.y = 270; gameState.player.vy = 0; }
            }

            // Apply Player Visuals
            playerEl.style.bottom = (floorHeight + gameState.player.y) + 'px';
            playerEl.style.transform = `rotate(${gameState.player.rot}deg)`;

            // 2. WORLD MOVEMENT
            gameState.distance += gameState.speed;
            
            // 3. SPAWN & RENDER OBSTACLES
            // We only render objects that are within view (optimization)
            // Viewport is 0 to 800. Global X is gameState.distance.
            // Render objects between distance and distance + 900
            
            obsContainer.innerHTML = ''; // Clear frame (inefficient but simple for logic)
            
            let playerHitbox = playerEl.getBoundingClientRect();
            // Shrink hitbox slightly for fairness
            const pRect = {
                l: playerHitbox.left + 8,
                r: playerHitbox.right - 8,
                t: playerHitbox.top + 8,
                b: playerHitbox.bottom - 8
            };

            // Loop through level data
            // Optimization: Find start index approx
            let startIdx = Math.floor(gameState.distance / 60);
            
            for (let i = startIdx; i < startIdx + 18; i++) {
                if (!gameState.levelData[i]) {
                    // Level End
                    if (i > gameState.levelData.length) {
                        gameState.active = false;
                        document.getElementById('win-screen').classList.remove('hidden');
                        return;
                    }
                    continue;
                }

                let obj = gameState.levelData[i];
                if (obj.type === 0) continue;

                let screenX = obj.x - gameState.distance + 150; // +150 is player offset
                
                // Draw DOM Element
                let el = document.createElement('div');
                el.classList.add('obstacle');
                el.style.left = screenX + 'px';
                
                if (obj.type === 1) { // Spike
                    el.classList.add('spike');
                    el.style.bottom = floorHeight + 'px';
                    // COLLISION (Box overlap)
                    // Spike rect (approx)
                    let sRect = { l: screenX + 10, r: screenX + 30, t: 450 - floorHeight - 30, b: 450 - floorHeight }; 
                    // Manual Rect Check (because generated DOM rects lag one frame)
                    // Player Y needs to be converted to Screen Y
                    let pScreenBot = 450 - (floorHeight + gameState.player.y);
                    let pScreenTop = pScreenBot - 40;
                    
                    if (150 + 30 > screenX + 10 && 150 + 10 < screenX + 30) { // X Overlap
                        if (gameState.player.y < 35) { // Y Overlap (Height of spike)
                            die(); return;
                        }
                    }

                } else if (obj.type === 2) { // Block
                    el.classList.add('block');
                    el.style.bottom = floorHeight + 'px';
                    if (150 + 35 > screenX && 150 + 5 < screenX + 40) {
                        if (gameState.player.y < 40) { die(); return; }
                    }
                } else if (obj.type === 3) { // Orb
                    el.classList.add('orb');
                    el.style.bottom = (floorHeight + 100) + 'px';
                } else if (obj.type === 4) { // Ship Portal
                    el.classList.add('portal', 'portal-ship');
                    el.style.bottom = (floorHeight + 50) + 'px';
                    if (150 > screenX && 150 < screenX + 30) {
                        gameState.player.mode = 'ship';
                        playerEl.classList.add('ship');
                        document.getElementById('ceiling').style.top = '0px';
                    }
                } else if (obj.type === 5) { // Cube Portal
                    el.classList.add('portal', 'portal-cube');
                    el.style.bottom = (floorHeight + 50) + 'px';
                    if (150 > screenX && 150 < screenX + 30) {
                        gameState.player.mode = 'cube';
                        playerEl.classList.remove('ship');
                        document.getElementById('ceiling').style.top = '-90px';
                    }
                }

                obsContainer.appendChild(el);
            }

            // Progress Bar
            let totalDist = gameState.levelData.length * 60;
            document.getElementById('progress-bar').style.width = (gameState.distance / totalDist * 100) + "%";

            requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
