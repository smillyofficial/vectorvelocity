<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Velocity: RAGE EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #00f2ff;
            --danger: #ff0055;
            --orb: #ffeb3b;
            --portal-ship: #d900ff;
            --portal-cube: #00ff6a;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: white;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(180deg, #1a1a2e 0%, #000000 100%);
            border: 4px solid var(--primary);
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
            overflow: hidden;
            border-radius: 8px;
        }

        /* --- BACKGROUND --- */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 100%;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: scrollBg 5s linear infinite;
            z-index: 0;
        }

        @keyframes scrollBg { from { transform: translateX(0); } to { transform: translateX(-60px); } }

        /* --- ENTITIES --- */
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #fce38a, #f38181);
            border: 2px solid white;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Ship Mode Visual */
        #player.ship {
            border-radius: 0 50% 50% 0; /* Bullet shape */
            height: 30px; /* Smaller hitbox */
            background: linear-gradient(90deg, #fce38a, #f38181);
        }

        #floor, #ceiling {
            position: absolute;
            width: 100%;
            height: 80px;
            background: #0f0f1a;
            z-index: 10;
            border-top: 3px solid white;
        }
        #floor { bottom: 0; }
        #ceiling { top: -80px; border-bottom: 3px solid white; border-top: none; } /* Only visible in ship mode logic */

        .obstacle { position: absolute; z-index: 15; }

        /* Spike */
        .spike {
            width: 0; height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid var(--danger);
            filter: drop-shadow(0 0 5px var(--danger));
        }

        /* Block */
        .block {
            width: 40px; height: 40px;
            background: rgba(0, 242, 255, 0.2);
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px var(--primary);
        }

        /* Jump Orb */
        .orb {
            width: 30px; height: 30px;
            background: radial-gradient(circle, var(--orb) 40%, transparent 70%);
            border: 2px solid var(--orb);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--orb);
            animation: pulse 1s infinite;
        }

        /* Portals */
        .portal {
            width: 30px; height: 80px;
            border-radius: 10px;
            opacity: 0.8;
            box-shadow: 0 0 20px currentColor;
        }
        .portal-ship { background: var(--portal-ship); color: var(--portal-ship); }
        .portal-cube { background: var(--portal-cube); color: var(--portal-cube); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* --- UI --- */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
        }
        .hidden { display: none !important; }

        h1 { font-size: 2.5rem; text-shadow: 0 0 20px var(--primary); text-transform: uppercase; margin-bottom: 10px; text-align: center;}
        
        .btn {
            padding: 15px 40px;
            font-family: 'Orbitron'; font-size: 1.2rem; font-weight: bold;
            color: white; background: transparent; border: 2px solid var(--primary);
            cursor: pointer; margin-top: 15px; transition: 0.2s;
            text-transform: uppercase;
        }
        .btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px var(--primary); }

        #progress-bar { position: absolute; top: 0; left: 0; height: 5px; background: var(--primary); width: 0%; z-index: 90; }
        
        #hud { position: absolute; top: 15px; left: 15px; z-index: 80; font-size: 1rem; color: #aaa; }
        
        #music-btn {
            position: absolute; top: 15px; right: 15px; z-index: 110;
            background: none; border: 1px solid #555; color: #555; padding: 5px 10px; cursor: pointer;
            font-family: 'Orbitron';
        }

    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="bg-grid"></div>
        <div id="progress-bar"></div>
        <div id="hud"><span id="level-name">Level 1</span></div>
        <button id="music-btn" onclick="toggleAudio()">🔊 MUSIC: OFF</button>

        <div id="game-world">
            <div id="player"></div>
            <div id="obstacles-container"></div>
        </div>

        <div id="floor"></div>
        <div id="ceiling" style="top: -100px;"></div> <div id="main-menu" class="ui-layer">
            <h1>Vector Velocity<br><span style="font-size:1.5rem; color:var(--danger)">RAGE EDITION</span></h1>
            
            <label style="color: #aaa; margin-top: 10px;">SELECT DIFFICULTY</label>
            <select id="level-select" style="padding: 10px; background: black; color: white; border: 1px solid var(--primary); font-family: 'Orbitron'; margin: 10px;">
                <option value="0">1. Warm Up</option>
                <option value="1">2. Basic Flight</option>
                <option value="2">3. Rhythm Orbs</option>
                <option value="3">4. Speed Up</option>
                <option value="4">5. The Gauntlet</option>
                <option value="5">6. Chaos Theory</option>
                <option value="6">7. Gravity Flux</option>
                <option value="7">8. Precision</option>
                <option value="8" style="color: #ff0055;">9. NIGHTMARE</option>
                <option value="9" style="color: #ff0055; font-weight: bold;">10. ZENITH</option>
            </select>

            <button class="btn" onclick="startGame()">START ATTEMPT 1</button>
            <p style="font-size: 0.8rem; color: #666; max-width: 400px; text-align: center; margin-top: 20px;">
                Controls: Click / Space to Jump.<br>Hold Click in Ship Mode.<br>Hit Yellow Orbs mid-air to jump.
            </p>
        </div>

        <div id="death-screen" class="ui-layer hidden">
            <h1 style="color: var(--danger);">DESTROYED</h1>
            <p id="death-msg" style="color: #aaa;">That was pathetic.</p>
            <button class="btn" onclick="resetGame()">RETRY</button>
            <button class="btn" style="border-color: white; margin-top: 10px; font-size: 0.8rem;" onclick="showMenu()">QUIT</button>
        </div>

        <div id="win-screen" class="ui-layer hidden">
            <h1 style="color: gold;">LEVEL COMPLETE</h1>
            <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (Procedural Techno) ---
        const AudioEngine = {
            ctx: null,
            isPlaying: false,
            nextNoteTime: 0,
            noteIndex: 0,
            tempo: 130,

            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            toggle: function() {
                this.init();
                this.isPlaying = !this.isPlaying;
                const btn = document.getElementById('music-btn');
                
                if (this.isPlaying) {
                    btn.innerText = "🔊 MUSIC: ON";
                    btn.style.color = "#00f2ff";
                    btn.style.borderColor = "#00f2ff";
                    this.nextNoteTime = this.ctx.currentTime;
                    this.scheduler();
                } else {
                    btn.innerText = "🔊 MUSIC: OFF";
                    btn.style.color = "#555";
                    btn.style.borderColor = "#555";
                }
            },

            playKick: function(time) {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
                gain.gain.setValueAtTime(0.8, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
                osc.start(time);
                osc.stop(time + 0.5);
            },

            playHat: function(time) {
                const bufferSize = this.ctx.sampleRate * 0.05;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.2;
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(time);
            },

            playBass: function(time, freq) {
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.frequency.value = freq;
                filter.frequency.setValueAtTime(200, time);
                filter.frequency.linearRampToValueAtTime(800, time + 0.1);
                filter.frequency.linearRampToValueAtTime(200, time + 0.2);
                gain.gain.setValueAtTime(0.2, time);
                gain.gain.linearRampToValueAtTime(0, time + 0.2);
                
                osc.start(time);
                osc.stop(time + 0.2);
            },

            scheduler: function() {
                if (!this.isPlaying) return;
                const secondsPerBeat = 60.0 / this.tempo;
                const scheduleAheadTime = 0.1;

                while (this.nextNoteTime < this.ctx.currentTime + scheduleAheadTime) {
                    // Simple Techno Pattern: Kick on every beat, Hat on off-beats
                    // 1  &  2  &  3  &  4  &
                    // K  H  K  H  K  H  K  H
                    
                    this.playKick(this.nextNoteTime);
                    this.playHat(this.nextNoteTime + (secondsPerBeat/2));
                    
                    // Bass line pattern
                    let freq = (this.noteIndex % 8 < 4) ? 55 : 41.2; // A1 then E1
                    if (this.noteIndex % 4 === 0) this.playBass(this.nextNoteTime + (secondsPerBeat/2), freq);

                    this.nextNoteTime += secondsPerBeat;
                    this.noteIndex++;
                }
                setTimeout(() => this.scheduler(), 25);
            }
        };

        function toggleAudio() { AudioEngine.toggle(); }

        // --- GAME CONSTANTS & STATE ---
        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        const FLOOR_HEIGHT = 80;
        
        const state = {
            running: false,
            frame: 0,
            x: 0, // Global distance traveled
            player: { 
                y: 0, 
                vy: 0, 
                mode: 'cube', // 'cube' or 'ship'
                rotation: 0,
                isDead: false
            },
            level: [],
            levelIdx: 0,
            gravity: 0.6,
            attempts: 1
        };

        // --- LEVEL GENERATION (The hard part) ---
        // 0: Empty, 1: Spike, 2: Block, 3: Orb, 4: Ship Portal, 5: Cube Portal
        
        function generateLevel(difficulty) {
            let data = [];
            let len = 100 + (difficulty * 20);
            
            // Base floor/spikes
            for(let i=0; i<len; i++) {
                // Safe zone at start
                if(i < 15) { data.push(0); continue; }
                
                let r = Math.random();
                let type = 0;

                // Increased difficulty logic
                if (difficulty >= 8) { // Nightmare & Zenith logic
                    if (i % 6 === 0) type = 1; // Constant spikes
                    if (i % 25 === 0) type = 4; // Frequent Ship portals
                    if (i % 28 === 0) type = 5; // Back to cube
                    if (i % 12 === 0) type = 3; // Orbs required
                } else if (difficulty > 4) {
                    if (r > 0.7) type = 1;
                    if (r > 0.95) type = 2; // Blocks
                    if (r > 0.90 && r < 0.95) type = 3; // Orbs
                    if (i === 50) type = 4; // Ship section mid level
                    if (i === 100) type = 5; // End ship
                } else {
                    if (r > 0.8) type = 1;
                }

                // Prevent impossible start overlaps
                if (data[i-1] !== 0 && data[i-1] !== 3) type = 0; 
                
                data.push(type);
            }

            // ZENITH (Level 10) Custom Override - RAGE QUIT DESIGN
            if (difficulty === 9) {
                // Hardcoded pattern for the first 50 blocks
                let pattern = [0,0,0,0,0,1,1,1,3,0,1,1,3,0,0,2,2,1,0,4,0,0,2,0,2,0,2,0,2,0,5,0,1,1,1,3,3,3,0,1]; 
                // Fill the rest randomly but HARD
                for(let k=0; k<200; k++) pattern.push(Math.random() > 0.5 ? (k%2===0?1:0) : (k%10===0?3:0));
                return pattern;
            }

            return data;
        }

        // --- GAME LOOP & LOGIC ---

        const playerEl = document.getElementById('player');
        const obsContainer = document.getElementById('obstacles-container');
        const progressBar = document.getElementById('progress-bar');
        
        // Input Handling
        let inputActive = false;
        let inputDown = false; // For holding (ship)

        function handleInput(down) {
            inputActive = down;
            if (down) {
                inputDown = true;
                
                if (state.player.isDead) return;

                // CUBE JUMP
                if (state.player.mode === 'cube') {
                    // Ground Jump
                    if (state.player.y <= 0) {
                        state.player.vy = 12; // Jump force
                        createParticles(100, FLOOR_HEIGHT);
                    }
                    // Orb Jump (Check for overlap)
                    checkOrbInteraction();
                }
            } else {
                inputDown = false;
            }
        }

        document.addEventListener('keydown', (e) => { if(e.code === 'Space') handleInput(true); });
        document.addEventListener('keyup', (e) => { if(e.code === 'Space') handleInput(false); });
        document.addEventListener('mousedown', () => handleInput(true));
        document.addEventListener('mouseup', () => handleInput(false));
        document.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(true); }, {passive: false});
        document.addEventListener('touchend', (e) => { e.preventDefault(); handleInput(false); });

        function checkOrbInteraction() {
            // Find nearby orbs
            const orbs = document.querySelectorAll('.orb');
            orbs.forEach(orb => {
                let rect = orb.getBoundingClientRect();
                let pRect = playerEl.getBoundingClientRect();
                
                // Simple AABB collision check
                if (rect.left < pRect.right && rect.right > pRect.left &&
                    rect.top < pRect.bottom && rect.bottom > pRect.top) {
                    
                    // HIT!
                    state.player.vy = 14; // High jump
                    state.player.y += 5; // Lift off slightly to prevent double triggering
                    orb.style.opacity = 0; // Visual feedback
                    createParticles(pRect.left, pRect.top);
                }
            });
        }

        function update() {
            if (!state.running) return;

            // 1. PHYSICS
            if (state.player.mode === 'cube') {
                state.player.vy -= state.gravity; // Gravity down
                state.player.y += state.player.vy;

                // Floor collision
                if (state.player.y <= 0) {
                    state.player.y = 0;
                    state.player.vy = 0;
                    // Snap rotation
                    let r = state.player.rotation % 90;
                    if (r !== 0) state.player.rotation += (90 - r) * 0.2;
                } else {
                    state.player.rotation += 5; // Spin in air
                }
            } 
            else if (state.player.mode === 'ship') {
                // Flappy Bird physics
                if (inputDown) {
                    state.player.vy += 0.4; // Thrust up
                } else {
                    state.player.vy -= 0.4; // Gravity down
                }
                
                // Terminal Velocity caps
                if(state.player.vy > 6) state.player.vy = 6;
                if(state.player.vy < -6) state.player.vy = -6;

                state.player.y += state.player.vy;
                
                // Ship Rotation based on velocity
                state.player.rotation = state.player.vy * -5;

                // Ceiling/Floor Collision for Ship
                if (state.player.y <= 0) { state.player.y = 0; state.player.vy = 0; }
                if (state.player.y >= (GAME_HEIGHT - FLOOR_HEIGHT - 40)) {
                     state.player.y = (GAME_HEIGHT - FLOOR_HEIGHT - 40); 
                     state.player.vy = 0; 
                }
            }

            // Apply Visuals
            playerEl.style.bottom = (state.player.y + FLOOR_HEIGHT) + 'px';
            playerEl.style.transform = `rotate(${state.player.rotation}deg)`;

            // 2. WORLD MOVEMENT & GENERATION
            state.x += 8; // Speed
            
            // Move obstacles
            const obstacles = document.querySelectorAll('.game-obj');
            obstacles.forEach(obj => {
                let x = parseFloat(obj.dataset.x) - state.x;
                obj.style.left = x + 'px';
                
                // Collision Detection (Hitbox)
                if (x > 50 && x < 150) { // Broad X Check
                     checkCollision(obj);
                }

                // Cleanup
                if (x < -100) obj.remove();
            });

            // 3. SPAWNING
            let nextIndex = Math.floor((state.x + 800) / 60); // 60px grid size
            if (!state.spawnedUntil) state.spawnedUntil = 0;

            while (state.spawnedUntil <= nextIndex) {
                let type = state.level[state.spawnedUntil];
                if (type && type !== 0) spawnObject(type, state.spawnedUntil * 60);
                state.spawnedUntil++;
            }

            // 4. PROGRESS & WIN
            let totalLen = state.level.length * 60;
            let prog = Math.min(100, (state.x / totalLen) * 100);
            progressBar.style.width = prog + '%';

            if (state.x > totalLen) winGame();
            else requestAnimationFrame(update);
        }

        function spawnObject(type, xPos) {
            const el = document.createElement('div');
            el.classList.add('game-obj');
            el.dataset.x = xPos;
            el.dataset.type = type;
            
            // Set styles based on type
            if (type === 1) { // Spike
                el.classList.add('obstacle', 'spike');
                el.style.bottom = FLOOR_HEIGHT + 'px';
            } else if (type === 2) { // Block
                el.classList.add('obstacle', 'block');
                el.style.bottom = FLOOR_HEIGHT + 'px';
            } else if (type === 3) { // Orb
                el.classList.add('obstacle', 'orb');
                el.style.bottom = (FLOOR_HEIGHT + 80) + 'px'; // Mid air
            } else if (type === 4) { // Ship Portal
                el.classList.add('obstacle', 'portal', 'portal-ship');
                el.style.bottom = (FLOOR_HEIGHT + 40) + 'px';
            } else if (type === 5) { // Cube Portal
                el.classList.add('obstacle', 'portal', 'portal-cube');
                el.style.bottom = (FLOOR_HEIGHT + 40) + 'px';
            }

            obsContainer.appendChild(el);
        }

        function checkCollision(obj) {
            let pRect = playerEl.getBoundingClientRect();
            let oRect = obj.getBoundingClientRect();
            let type = parseInt(obj.dataset.type);

            // Tighter Hitboxes for Rage Mode
            let padding = 8; 

            if (pRect.right - padding > oRect.left && 
                pRect.left + padding < oRect.right && 
                pRect.bottom - padding > oRect.top && 
                pRect.top + padding < oRect.bottom) {
                
                if (type === 1 || type === 2) {
                    die(); // Spike or Block = Death
                } else if (type === 4) {
                    // Ship Mode
                    state.player.mode = 'ship';
                    playerEl.classList.add('ship');
                    document.getElementById('ceiling').style.top = '0';
                } else if (type === 5) {
                    // Cube Mode
                    state.player.mode = 'cube';
                    playerEl.classList.remove('ship');
                    document.getElementById('ceiling').style.top = '-100px';
                }
            }
        }

        function createParticles(x, y) {
            // Very simple visual effect
            // In a full engine this would be complex, here we skip for performance/code size
        }

        function die() {
            state.running = false;
            state.player.isDead = true;
            document.getElementById('death-screen').classList.remove('hidden');
            
            const msgs = ["RAGE QUIT?", "SO CLOSE...", "TRY AGAIN", "EMBARRASSING", "OUCH"];
            document.getElementById('death-msg').innerText = msgs[Math.floor(Math.random()*msgs.length)];
        }

        function winGame() {
            state.running = false;
            document.getElementById('win-screen').classList.remove('hidden');
        }

        // --- MENU CONTROLS ---

        function startGame() {
            let lvlIdx = parseInt(document.getElementById('level-select').value);
            state.levelIdx = lvlIdx;
            
            // Set visual attempt count
            let btn = document.querySelector('.btn');
            btn.innerText = `ATTEMPT ${state.attempts}`;

            resetGame();
        }

        function resetGame() {
            // Hide UI
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            
            // Reset State
            state.running = true;
            state.x = 0;
            state.spawnedUntil = 0;
            state.player.y = 0;
            state.player.vy = 0;
            state.player.rotation = 0;
            state.player.isDead = false;
            state.player.mode = 'cube';
            state.attempts++;

            // Reset DOM
            obsContainer.innerHTML = '';
            playerEl.classList.remove('ship');
            document.getElementById('ceiling').style.top = '-100px';

            // Generate Level Data
            state.level = generateLevel(state.levelIdx);

            requestAnimationFrame(update);
        }

        function showMenu() {
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function nextLevel() {
            document.getElementById('win-screen').classList.add('hidden');
            if (state.levelIdx < 9) {
                state.levelIdx++;
                document.getElementById('level-select').value = state.levelIdx;
                resetGame();
            } else {
                showMenu();
            }
        }

    </script>
</body>
</html>
