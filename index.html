<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Velocity: Arcade Cabinet</title>
    <style>
        /* --- ARCADE GLOBAL STYLES --- */
        :root {
            --arcade-primary: #ff0077;
            --arcade-secondary: #00ffff;
            --arcade-bg: #111111;
            --arcade-text: #f0f0f0;
            --danger: #ff0055;
            --orb: #ffeb3b;
        }

        body {
            margin: 0; background-color: #050505; color: var(--arcade-text);
            font-family: 'Arial Black', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
            text-shadow: 0 0 5px var(--arcade-text);
        }

        #game-wrapper {
            position: relative; width: 800px; height: 450px;
            background: var(--arcade-bg);
            border: 8px solid var(--arcade-secondary);
            box-shadow: 0 0 100px var(--arcade-secondary), inset 0 0 50px var(--arcade-secondary);
            overflow: hidden; border-radius: 4px;
        }

        /* Scanline Effect (Retro CRT Look) */
        #game-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000; pointer-events: none; background-size: 100% 4px, 3px 100%;
            opacity: 0.5;
        }

        /* --- BACKGROUND & ENTITIES --- */
        .bg-grid {
            position: absolute; width: 200%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 60px 60px; animation: scrollBg 5s linear infinite; z-index: 0;
        }
        @keyframes scrollBg { from { transform: translateX(0); } to { transform: translateX(-60px); } }

        #player { border: 4px solid var(--arcade-text); z-index: 20; position: absolute; width: 40px; height: 40px; box-sizing: border-box; left: 150px; transition: height 0.1s, margin 0.1s; }
        #player.ship { border-radius: 0 50% 50% 0; height: 25px; margin-bottom: 7px; }

        #floor, #ceiling {
            position: absolute; width: 100%; height: 90px; background: #222222; z-index: 10;
            border-top: 4px solid var(--arcade-primary); bottom: 0;
        }
        #ceiling { top: -90px; bottom: auto; border-bottom: 4px solid var(--arcade-primary); border-top: none; transition: top 0.3s; }

        /* Obstacles */
        .obstacle { position: absolute; z-index: 15; transition: left 0.01s linear, opacity 0.1s; }
        .spike { width: 40px; height: 40px; }
        .spike::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 0;
            border-left: 20px solid transparent; border-right: 20px solid transparent;
            border-bottom: 40px solid var(--danger); filter: drop-shadow(0 0 10px var(--danger));
        }
        .orb { width: 36px; height: 36px; background: radial-gradient(circle, var(--orb) 40%, transparent 70%); border: 4px solid var(--orb); border-radius: 50%; box-shadow: 0 0 20px var(--orb); animation: pulse 0.5s infinite alternate; }
        .orb.used { opacity: 0.2 !important; animation: none; cursor: default; }

        /* Portals (Visibility Fix) */
        .portal { width: 30px; height: 90px; border-radius: 10px; z-index: 50; border: 4px solid white; opacity: 1; }
        .portal-ship { background: #d900ff; color: #d900ff; box-shadow: 0 0 25px #d900ff; }
        .portal-cube { background: #00ff6a; color: #00ff6a; box-shadow: 0 0 25px #00ff6a; }


        /* --- UI STYLES --- */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(17, 17, 17, 0.95); backdrop-filter: blur(5px); transition: opacity 0.3s; }
        .hidden { display: none !important; }

        h1 { font-size: 3.5rem; color: var(--arcade-primary); letter-spacing: 8px; text-shadow: 0 0 15px var(--arcade-primary); }
        h2 { font-size: 1.2rem; color: var(--arcade-secondary); margin: 5px 0 25px 0; text-shadow: 0 0 10px var(--arcade-secondary); }

        /* Blocky Buttons */
        .btn, select {
            border-radius: 0; font-family: 'Arial Black', sans-serif;
            box-shadow: 0 0 15px var(--danger);
            border: 4px solid var(--arcade-text);
            padding: 12px 40px; cursor: pointer;
        }
        .btn:hover { background: var(--arcade-text); color: var(--arcade-primary); box-shadow: 0 0 30px var(--arcade-text); transform: scale(1.02); }
        
        /* Pause Buttons */
        .pause-btn { margin: 10px 0; padding: 15px 70px; font-size: 1.1rem; background: transparent; transition: 0.3s; }
        #pause-menu .pause-btn:nth-child(2) { border-color: #ff0077; box-shadow: 0 0 15px #ff0077, 0 0 30px #ff0077; color: #fff; text-shadow: 0 0 5px #ff0077; }
        #pause-menu .pause-btn:nth-child(3) { border-color: #00ff77; box-shadow: 0 0 15px #00ff77, 0 0 30px #00ff77; color: #fff; text-shadow: 0 0 5px #00ff77; }
        .pause-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.1); }

        /* --- LEADERBOARD STYLES --- */
        #leaderboard-section { width: 80%; max-width: 400px; margin-top: 30px; background: rgba(0, 0, 0, 0.4); border: 2px solid var(--arcade-secondary); padding: 15px; box-shadow: inset 0 0 10px var(--arcade-secondary); }
        #leaderboard-section h3 { color: var(--arcade-secondary); margin-top: 0; margin-bottom: 10px; font-size: 1.2rem; text-shadow: 0 0 5px var(--arcade-secondary); border-bottom: 1px dashed var(--arcade-secondary); padding-bottom: 5px; }
        .score-entry { display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 5px; }
        .rank { color: gold; font-weight: bold; }
        .time { color: var(--arcade-primary); }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="bg-grid"></div>
        <div id="progress-bar"></div>
        <div id="hud" class="hidden"><span id="level-name">Vector Velocity</span></div>

        <div id="game-world">
            <div id="player"></div>
            <div id="obstacles-container"></div>
        </div>

        <div id="floor"></div>
        <div id="ceiling"></div>

        <div id="main-menu" class="ui-layer">
            <h1>ARCADE VECTOR</h1>
            <h2>Insert Coin to Play</h2>

            <div style="margin-bottom: 5px; color: #888; font-size: 0.8rem;">SELECT CUBE SKIN</div>
            <div class="skin-container">
                <div class="skin-opt selected" style="background: linear-gradient(45deg, #fce38a, #f38181);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #00c6ff, #0072ff);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #11998e, #38ef7d);" onclick="setSkin(this)"></div>
                <div class="skin-opt" style="background: linear-gradient(45deg, #833ab4, #fd1d1d);" onclick="setSkin(this)"></div>
            </div>

            <select id="level-select">
                <option value="1">Lvl 1: The Beginning (Easy)</option>
                <option value="2">Lvl 2: Stereo (Normal)</option>
                <option value="3">Lvl 3: Polargeist (Normal)</option>
                <option value="4">Lvl 4: Dry Out (Hard)</option>
                <option value="5">Lvl 5: Base After (Hard)</option>
                <option value="6">Lvl 6: Can't Let Go (Harder)</option>
                <option value="7">Lvl 7: Jumper (Insane)</option>
                <option value="8">Lvl 8: Time Machine (Insane)</option>
                <option value="9">Lvl 9: NIGHTMARE (Extreme)</option>
                <option value="10">Lvl 10: ZENITH (IMPOSSIBLE)</option>
            </select>

            <button class="btn" onclick="startGame()">LAUNCH LEVEL</button>
            
            <div id="leaderboard-section">
                <h3>ZENITH HIGH SCORES</h3>
                <div id="leaderboard-content">No records yet.</div>
            </div>
        </div>

        <div id="pause-menu" class="ui-layer hidden">
            <h1 style="font-size: 3rem; margin-bottom: 40px; color: var(--arcade-text); text-shadow: 0 0 15px var(--arcade-text);">PAUSED</h1>
            <button class="pause-btn" onclick="togglePause(false)">RESUME</button>
            <button class="pause-btn" onclick="restartLevel()">RESTART</button>
            <button class="pause-btn" onclick="showMenu()">MAIN MENU</button>
        </div>

        <div id="death-screen" class="ui-layer hidden">
            <h1 style="color: var(--danger);">CRASHED</h1>
            <p id="death-quote" style="color: #aaa; margin: 20px;">0% Complete</p>
            <button class="btn" onclick="restartLevel()">RETRY</button>
            <button class="btn" style="background: transparent; border: 4px solid var(--arcade-text); color: white; margin-top: 10px; font-size: 0.8rem; box-shadow: none;" onclick="showMenu()">MAIN MENU</button>
        </div>

        <div id="end-cutscene" class="ui-layer hidden">
            <div id="player-trophy"></div>
            <div id="zenith-message">ZENITH REACHED!</div>
            <p id="final-time"></p>
            <button class="btn" onclick="showMenu()" style="background: var(--arcade-primary); color: black; box-shadow: 0 0 30px var(--arcade-primary);">VICTORY MENU</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (Unchanged for stability) ---
        const AudioEngine = {
            ctx: null, isPlaying: false, nextNoteTime: 0, noteIndex: 0, tempo: 120,
            delay: null, feedback: null, 

            init: function(levelDifficulty) {
                if (levelDifficulty <= 3) this.tempo = 120; else if (levelDifficulty <= 7) this.tempo = 145; else this.tempo = 175;
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.delay = this.ctx.createDelay(1.0); this.delay.delayTime.setValueAtTime(60.0 / this.tempo / 2, this.ctx.currentTime);
                    this.feedback = this.ctx.createGain(); this.feedback.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    this.delay.connect(this.feedback); this.feedback.connect(this.delay); this.delay.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.isPlaying = true; this.nextNoteTime = this.ctx.currentTime;
                this.scheduler(levelDifficulty);
            },
            stop: function() { this.isPlaying = false; },

            playTone: function(freq, time, type, dur, destination) {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
                osc.type = type; osc.frequency.setValueAtTime(freq, time);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(8000, time);
                osc.connect(filter); filter.connect(gain);
                gain.connect(destination || this.ctx.destination);
                gain.gain.setValueAtTime(0.3, time); gain.gain.exponentialRampToValueAtTime(0.01, time + dur);
                osc.start(time); osc.stop(time + dur);
            },

            scheduler: function(difficulty) {
                if (!this.isPlaying) return;
                const secondsPerBeat = 60.0 / this.tempo; const lookahead = 0.1;
                this.delay.delayTime.setValueAtTime(secondsPerBeat / 2, this.ctx.currentTime);

                while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
                    this.playTone(100, this.nextNoteTime, 'sine', 0.1, this.ctx.destination); this.playTone(100, this.nextNoteTime, 'sine', 0.1, this.delay);
                    if (this.noteIndex % 4 === 0) {
                        let bassFreq = (difficulty > 7) ? 41.2 : 55;
                        this.playTone(bassFreq, this.nextNoteTime, 'sawtooth', 0.3, this.delay);
                    }
                    if (this.noteIndex % 2 !== 0) {
                        this.playTone(8000, this.nextNoteTime, 'square', 0.05, this.ctx.destination);
                    }
                    this.nextNoteTime += secondsPerBeat; this.noteIndex++;
                }
                setTimeout(() => this.scheduler(difficulty), 25);
            }
        };

        // --- GAME ENGINE & STATE ---
        const playerEl = document.getElementById('player');
        const obsContainer = document.getElementById('obstacles-container');
        const floorHeight = 90;
        
        let gameState = {
            active: false,
            levelData: [],
            distance: 0,
            speed: 6.5, // <<< FIXED: Reduced speed for better jump control
            player: { y: 0, vy: 0, rot: 0, mode: 'cube' },
            gravity: 0.85,
            jumpPower: 14.8,
            currentSkin: 'linear-gradient(45deg, #fce38a, #f38181)',
            activeElements: new Map(),
            currentLevelIndex: 0,
            startTime: 0,
            isPaused: false,
            jumpBuffer: 0,
            maxJumpBuffer: 6
        };

        // --- LEADERBOARD FUNCTIONS (Unchanged) ---

        function loadScores() {
            const scores = JSON.parse(localStorage.getItem('vv_leaderboard')) || [];
            scores.sort((a, b) => a.time - b.time);
            return scores;
        }

        function saveScore(level, time) {
            if (level !== 10) return;
            let scores = loadScores();
            scores.push({ level, time, date: new Date().toLocaleDateString() });
            scores.sort((a, b) => a.time - b.time);
            scores = scores.slice(0, 5); 
            localStorage.setItem('vv_leaderboard', JSON.stringify(scores));
        }

        function renderLeaderboard() {
            const scores = loadScores();
            const content = document.getElementById('leaderboard-content');
            
            if (scores.length === 0) {
                content.innerHTML = '<div style="text-align: center; color: #aaa;">No records yet. Be the first!</div>';
                return;
            }

            let html = '';
            scores.forEach((score, index) => {
                const minutes = Math.floor(score.time / 60);
                const seconds = (score.time % 60).toFixed(2).padStart(5, '0');
                html += `
                    <div class="score-entry">
                        <span class="rank">${index + 1}.</span>
                        <span>Level ${score.level}</span>
                        <span class="time">${minutes}:${seconds}s</span>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        // --- GAME FLOW (Unchanged) ---

        function setSkin(el) {
            document.querySelectorAll('.skin-opt').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
            gameState.currentSkin = el.style.background;
            playerEl.style.background = gameState.currentSkin;
        }

        function generateLevel(levelNum) {
            let data = [];
            let length = 150 + (levelNum * 20); 
            let difficulty = levelNum / 10;
            let safeCount = 0; 
            
            for (let i = 0; i < length; i++) {
                let obj = { id: i, type: 0, x: i * 60, used: false };
                if (i < 20 || safeCount > 0) { data.push(obj); safeCount--; continue; }

                let r = Math.random();
                const minGap = (levelNum >= 9) ? 3 : 4; 

                if (r < (0.1 + difficulty * 0.4)) { obj.type = 1; safeCount = minGap; } 
                else if (r > 0.96 && levelNum > 3) { obj.type = 3; safeCount = minGap; } 
                else if (i === 60 && levelNum > 1) { obj.type = 4; } 
                else if (i === 120 && levelNum > 1) { obj.type = 5; }
                data.push(obj);
            }
            return data;
        }

        function startGame() {
            const levelVal = parseInt(document.getElementById('level-select').value);
            gameState.currentLevelIndex = levelVal;
            
            AudioEngine.stop(); AudioEngine.init(levelVal);

            gameState.active = true; gameState.distance = 0;
            gameState.player = { y: 0, vy: 0, rot: 0, mode: 'cube' };
            gameState.levelData = generateLevel(levelVal);
            gameState.startTime = AudioEngine.ctx.currentTime; 
            gameState.jumpBuffer = 0;

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('end-cutscene').classList.add('hidden');
            document.getElementById('pause-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('level-name').innerText = "Level " + levelVal;
            
            playerEl.style.background = gameState.currentSkin; playerEl.classList.remove('ship');
            document.getElementById('ceiling').style.top = '-90px';
            
            gameState.activeElements.forEach(el => el.remove());
            gameState.activeElements.clear();
            
            gameLoop();
        }

        function restartLevel() {
            const levelVal = gameState.currentLevelIndex || parseInt(document.getElementById('level-select').value);
            document.getElementById('level-select').value = levelVal; 
            startGame();
        }
        
        function showMenu() {
            gameState.active = false; AudioEngine.stop();
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('end-cutscene').classList.add('hidden');
            document.getElementById('pause-menu').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            renderLeaderboard();
        }
        
        window.onload = renderLeaderboard;

        function togglePause(shouldPause) {
            gameState.active = !shouldPause;
            gameState.isPaused = shouldPause;

            if (shouldPause) {
                AudioEngine.stop();
                document.getElementById('pause-menu').classList.remove('hidden');
            } else {
                AudioEngine.init(gameState.currentLevelIndex);
                document.getElementById('pause-menu').classList.add('hidden');
                gameLoop();
            }
        }

        function die() {
            gameState.active = false; AudioEngine.stop();
            let totalDist = gameState.levelData.length * 60;
            let pct = Math.floor((gameState.distance / totalDist) * 100);
            document.getElementById('death-quote').innerText = `${pct}% Complete`;
            document.getElementById('death-screen').classList.remove('hidden');
        }

        function winGame() {
            gameState.active = false; AudioEngine.stop();
            
            const endTime = AudioEngine.ctx.currentTime;
            const totalTime = endTime - gameState.startTime;
            const minutes = Math.floor(totalTime / 60);
            const seconds = (totalTime % 60).toFixed(2);
            
            document.getElementById('final-time').innerText = `Time: ${minutes}:${seconds}s`;
            
            saveScore(gameState.currentLevelIndex, totalTime);

            document.getElementById('end-cutscene').classList.remove('hidden');
        }

        // --- INPUT & ORBS (Unchanged) ---
        let inputHeld = false;
        
        function handleInput(down) {
            inputHeld = down;
            if (down && gameState.active) {
                if (gameState.player.mode === 'cube') {
                    gameState.jumpBuffer = gameState.maxJumpBuffer;
                    checkOrbs();
                }
            }
        }
        
        window.addEventListener('keydown', (e) => { 
            if(e.code==='Space') handleInput(true);
            if((e.code==='Escape' || e.code==='KeyP') && !gameState.isPaused && gameState.active) { togglePause(true); }
            else if((e.code==='Escape' || e.code==='KeyP') && gameState.isPaused) { togglePause(false); }
        });
        window.addEventListener('keyup', (e) => { if(e.code==='Space') handleInput(false) });
        window.addEventListener('mousedown', () => { if(gameState.active) handleInput(true); });
        window.addEventListener('mouseup', () => { if(gameState.active) handleInput(false); });


        function checkOrbs() {
            const orbs = document.querySelectorAll('.orb');
            const pRect = playerEl.getBoundingClientRect();
            
            orbs.forEach(orbEl => {
                if (orbEl.classList.contains('used')) return;

                const oRect = orbEl.getBoundingClientRect();
                const dx = (pRect.left + pRect.width/2) - (oRect.left + oRect.width/2);
                const dy = (pRect.top + pRect.height/2) - (oRect.top + oRect.height/2);
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 40) {
                    gameState.player.vy = 15;
                    orbEl.classList.add('used'); 
                }
            });
        }
        
        function gameLoop() {
            if (!gameState.active) return;

            // 1. JUMP BUFFER DECREMENT
            if (gameState.jumpBuffer > 0) {
                gameState.jumpBuffer--;
            }

            // 2. PHYSICS
            if (gameState.player.mode === 'cube') {
                
                // JUMP EXECUTION: Execute jump if buffered AND player is grounded
                if (gameState.jumpBuffer > 0 && gameState.player.y <= 1.0) {
                    gameState.player.vy = gameState.jumpPower;
                    gameState.jumpBuffer = 0;
                }

                gameState.player.vy -= gameState.gravity; gameState.player.y += gameState.player.vy;
                if (gameState.player.y <= 0) { gameState.player.y = 0; gameState.player.vy = 0; gameState.player.rot += (90 - (gameState.player.rot % 90)) * 0.2; } else { gameState.player.rot += 6; }
            } else { 
                if (inputHeld) gameState.player.vy += 0.5; else gameState.player.vy -= 0.5;
                if (gameState.player.vy > 8) gameState.player.vy = 8; if (gameState.player.vy < -8) gameState.player.vy = -8;
                gameState.player.y += gameState.player.vy; gameState.player.rot = gameState.player.vy * -3;
                if (gameState.player.y <= 0) { gameState.player.y = 0; gameState.player.vy = 0; }
                if (gameState.player.y >= 270) { gameState.player.y = 270; gameState.player.vy = 0; }
            }
            playerEl.style.bottom = (floorHeight + gameState.player.y) + 'px';
            playerEl.style.transform = `rotate(${gameState.player.rot}deg)`;

            // 3. WORLD MOVEMENT & COLLISION
            gameState.distance += gameState.speed;
            
            let startIdx = Math.floor(gameState.distance / 60);
            let objectsRendered = [];

            for (let i = startIdx; i < startIdx + 18; i++) {
                const obj = gameState.levelData[i];
                if (!obj) continue;
                if (obj.type === 0) { 
                    if (gameState.activeElements.has(obj.id)) { gameState.activeElements.get(obj.id).remove(); gameState.activeElements.delete(obj.id); }
                    continue;
                }
                
                let screenX = obj.x - gameState.distance + 150;
                let el = gameState.activeElements.get(obj.id);

                if (!el) {
                    el = document.createElement('div'); el.classList.add('obstacle'); el.style.left = screenX + 'px';
                    if (obj.type === 1) el.classList.add('spike');
                    else if (obj.type === 3) el.classList.add('orb');
                    else if (obj.type === 4) el.classList.add('portal', 'portal-ship');
                    else if (obj.type === 5) el.classList.add('portal', 'portal-cube');
                    
                    let bottomY = floorHeight;
                    if (obj.type === 3) bottomY += 100; else if (obj.type > 3) bottomY += 50; 
                    el.style.bottom = bottomY + 'px';

                    obsContainer.appendChild(el); gameState.activeElements.set(obj.id, el);
                }

                el.style.left = screenX + 'px';
                
                const isOverlappingX = (150 > screenX - 40 + 35) && (150 < screenX + 40 - 35);
                
                if (obj.type === 1) { 
                    if (isOverlappingX && gameState.player.y < 35) { die(); return; }
                } else if (obj.type === 4) { 
                    if (150 > screenX && 150 < screenX + 30) { gameState.player.mode = 'ship'; playerEl.classList.add('ship'); document.getElementById('ceiling').style.top = '0px'; }
                } else if (obj.type === 5) { 
                    if (150 > screenX && 150 < screenX + 30) { gameState.player.mode = 'cube'; playerEl.classList.remove('ship'); document.getElementById('ceiling').style.top = '-90px'; }
                }
                objectsRendered.push(obj.id);
            }

            // 4. Cleanup Off-Screen Elements
            gameState.activeElements.forEach((el, id) => {
                if (objectsRendered.indexOf(id) === -1) {
                    el.remove();
                    gameState.activeElements.delete(id);
                }
            });


            // 5. PROGRESS & WIN
            let totalDist = gameState.levelData.length * 60;
            document.getElementById('progress-bar').style.width = (gameState.distance / totalDist * 100) + "%";
            
            if (gameState.distance > totalDist + 500) { 
                winGame(); return;
            }

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
